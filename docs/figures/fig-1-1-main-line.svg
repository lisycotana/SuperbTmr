<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2786FF"/>
      <stop offset="1" stop-color="#6E4AFF"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2786FF"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#FF69B4"/>
    </marker>
  </defs>

  <rect width="1200" height="230" fill="#FAFBFD"/>

  <!-- title -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#8A94A6" letter-spacing="1.2">图 1-1　最终主线</text>

  <!-- main chain -->
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <g>
      <rect x="40" y="70" width="150" height="62" rx="10" fill="#fff" stroke="#D7DEEA"/>
      <text x="115" y="96" fill="#1F2733">声明式作业定义</text>
      <text x="115" y="116" font-size="11" font-weight="500" fill="#8A94A6">JSON · 参数化 · 版本化</text>
    </g>
    <g>
      <rect x="222" y="70" width="150" height="62" rx="10" fill="#fff" stroke="#D7DEEA"/>
      <text x="297" y="96" fill="#1F2733">集群实时清单</text>
      <text x="297" y="116" font-size="11" font-weight="500" fill="#8A94A6">nvidia-smi · 周期探测</text>
    </g>
    <g>
      <rect x="404" y="70" width="150" height="62" rx="10" fill="#fff" stroke="#D7DEEA"/>
      <text x="479" y="96" fill="#1F2733">智能放置</text>
      <text x="479" y="116" font-size="11" font-weight="500" fill="#8A94A6">租约 · 最佳匹配 · 排队</text>
    </g>
    <g>
      <rect x="586" y="70" width="150" height="62" rx="10" fill="url(#g1)" stroke="none"/>
      <text x="661" y="96" fill="#fff">真实终端执行</text>
      <text x="661" y="116" font-size="11" font-weight="500" fill="#E4ECFF">PTY · 步骤按序 · 判据</text>
    </g>
    <g>
      <rect x="768" y="70" width="150" height="62" rx="10" fill="#fff" stroke="#D7DEEA"/>
      <text x="843" y="96" fill="#1F2733">卡死检出</text>
      <text x="843" y="116" font-size="11" font-weight="500" fill="#8A94A6">静默阈值 · 事件驱动</text>
    </g>
    <g>
      <rect x="950" y="70" width="150" height="62" rx="10" fill="#fff" stroke="#D7DEEA"/>
      <text x="1025" y="96" fill="#1F2733">结果回收对比</text>
      <text x="1025" y="116" font-size="11" font-weight="500" fill="#8A94A6">SFTP · 指标 · sha256</text>
    </g>
  </g>

  <!-- chain arrows -->
  <g stroke="#2786FF" stroke-width="1.6" fill="none">
    <line x1="190" y1="101" x2="216" y2="101" marker-end="url(#ar)"/>
    <line x1="372" y1="101" x2="398" y2="101" marker-end="url(#ar)"/>
    <line x1="554" y1="101" x2="580" y2="101" marker-end="url(#ar)"/>
    <line x1="736" y1="101" x2="762" y2="101" marker-end="url(#ar)"/>
    <line x1="918" y1="101" x2="944" y2="101" marker-end="url(#ar)"/>
  </g>

  <!-- agent label above chain -->
  <g>
    <rect x="404" y="26" width="332" height="30" rx="15" fill="#EEF3FF" stroke="#C9DBFF"/>
    <text x="570" y="46" font-size="12.5" font-weight="600" fill="#2B5FD9" text-anchor="middle">Agent 无人值守跑完上述全程</text>
    <path d="M570,56 L570,66" stroke="#C9DBFF" stroke-width="1.4" fill="none"/>
  </g>

  <!-- human in the loop -->
  <g>
    <rect x="300" y="158" width="600" height="46" rx="23" fill="#FFF0F7" stroke="#FFC9E2"/>
    <text x="600" y="186" font-size="13" font-weight="600" fill="#C2185B" text-anchor="middle">人只在判断处介入 —— 审批放行 · 随时接管终端 · 验收结论</text>
    <path d="M600,158 L600,140" stroke="#FF69B4" stroke-width="1.6" fill="none" marker-end="url(#ar2)"/>
  </g>

  <!-- footer note -->
  <text x="40" y="222" font-size="11.5" fill="#8A94A6">凭据由服务端持有：Agent 在 N 台主机上作业，读不到任何一个密码</text>
</svg>
