<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2786FF"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6E4AFF"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#FF69B4"/>
    </marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#FAFBFD"/>
  <text x="40" y="34" font-size="13" font-weight="700" fill="#8A94A6" letter-spacing="1.2">图 6-1　一次运行的完整时序：Agent 无人值守，人在判断处介入</text>

  <!-- lifelines -->
  <g stroke="#D7DEEA" stroke-width="1.4" stroke-dasharray="4 4">
    <line x1="230" y1="72" x2="230" y2="640"/>
    <line x1="600" y1="72" x2="600" y2="640"/>
    <line x1="970" y1="72" x2="970" y2="640"/>
  </g>

  <!-- actor boxes -->
  <g text-anchor="middle">
    <rect x="130" y="46" width="200" height="40" rx="20" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="230" y="71" font-size="13.5" font-weight="700" fill="#1D4ED8">AI Agent</text>

    <rect x="500" y="46" width="200" height="40" rx="20" fill="#F5F8FF" stroke="#C9DBFF"/>
    <text x="600" y="71" font-size="13.5" font-weight="700" fill="#2B5FD9">平台（exp + fleet）</text>

    <rect x="870" y="46" width="200" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="970" y="71" font-size="13.5" font-weight="700" fill="#334155">集群主机</text>
  </g>

  <!-- ============ step 1 ============ -->
  <g>
    <text x="60" y="126" font-size="11" font-weight="700" fill="#2786FF">1</text>
    <text x="76" y="126" font-size="11.5" fill="#5B6B85">提交作业：<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">resources: {gpus: 4}</tspan></text>
    <path d="M230,136 L600,136" stroke="#2786FF" stroke-width="1.6" marker-end="url(#a1)"/>
  </g>

  <!-- ============ step 2 ============ -->
  <g>
    <text x="60" y="172" font-size="11" font-weight="700" fill="#2786FF">2</text>
    <text x="76" y="172" font-size="11.5" fill="#5B6B85">周期探测 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">nvidia-smi</tspan>（复用长驻会话，非第二套通道）</text>
    <path d="M600,182 L970,182" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a1)"/>
    <path d="M970,194 L600,194" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  </g>

  <!-- ============ step 3 ============ -->
  <g>
    <text x="60" y="230" font-size="11" font-weight="700" fill="#2786FF">3</text>
    <text x="76" y="230" font-size="11.5" fill="#5B6B85">读清单 → 选有空位主机 → 租 4 卡（带心跳）</text>
    <rect x="615" y="240" width="330" height="30" rx="8" fill="#EEF3FF" stroke="#C9DBFF"/>
    <text x="780" y="260" font-size="11.5" font-weight="600" fill="#2B5FD9" text-anchor="middle">租约 + 决策理由</text>
  </g>

  <!-- ============ step 4 ============ -->
  <g>
    <text x="60" y="298" font-size="11" font-weight="700" fill="#2786FF">4</text>
    <text x="76" y="298" font-size="11.5" fill="#5B6B85">返回放置结果：主机 + 卡 + 为何选它</text>
    <path d="M600,308 L230,308" stroke="#2786FF" stroke-width="1.6" marker-end="url(#a1)"/>
  </g>

  <!-- ============ step 5 ============ -->
  <g>
    <text x="60" y="344" font-size="11" font-weight="700" fill="#2786FF">5</text>
    <text x="76" y="344" font-size="11.5" fill="#5B6B85">在选中主机开会话（SSH + PTY），凭据服务端解析</text>
    <path d="M600,354 L970,354" stroke="#2786FF" stroke-width="1.6" marker-end="url(#a1)"/>
  </g>

  <!-- ============ step 6 ============ -->
  <g>
    <text x="60" y="390" font-size="11" font-weight="700" fill="#2786FF">6</text>
    <text x="76" y="390" font-size="11.5" fill="#5B6B85">注入 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">CUDA_VISIBLE_DEVICES</tspan>，按序执行步骤</text>
    <path d="M600,400 L970,400" stroke="#6E4AFF" stroke-width="1.6" marker-end="url(#a2)"/>
  </g>

  <!-- ============ step 7 ============ -->
  <g>
    <text x="60" y="436" font-size="11" font-weight="700" fill="#2786FF">7</text>
    <text x="76" y="436" font-size="11.5" fill="#5B6B85">实时输出流（人可同时打开同一终端）</text>
    <path d="M970,446 L600,446" stroke="#22C55E" stroke-width="1.4" marker-end="url(#a4)"/>
    <path d="M600,458 L230,458" stroke="#22C55E" stroke-width="1.4" marker-end="url(#a4)"/>
  </g>

  <!-- ============ step 8 ============ -->
  <g>
    <text x="60" y="494" font-size="11" font-weight="700" fill="#FF69B4">8</text>
    <text x="76" y="494" font-size="11.5" fill="#5B6B85">静默 N 秒无新输出 → 判卡死（事件驱动，非轮询）</text>
    <rect x="615" y="504" width="250" height="28" rx="8" fill="#FFF0F7" stroke="#FFC9E2"/>
    <text x="740" y="523" font-size="11.5" font-weight="600" fill="#C2185B" text-anchor="middle">silence 事件触发</text>
  </g>

  <!-- ============ step 9 ============ -->
  <g>
    <text x="60" y="558" font-size="11" font-weight="700" fill="#FF69B4">9</text>
    <text x="76" y="558" font-size="11.5" fill="#5B6B85">读完整终端输出（DEAD 回放）：traceback + NCCL 超时</text>
    <path d="M600,568 L970,568" stroke="#6E4AFF" stroke-width="1.6" marker-end="url(#a2)"/>
    <path d="M970,580 L600,580" stroke="#6E4AFF" stroke-width="1.4" marker-end="url(#a2)"/>
  </g>

  <!-- ============ step 10 ============ -->
  <g>
    <text x="60" y="616" font-size="11" font-weight="700" fill="#FF69B4">10</text>
    <text x="76" y="616" font-size="11.5" fill="#5B6B85">Agent 决策：重试 / 调整 / 叫人（审批门覆盖危险动作）</text>
    <path d="M230,626 L600,626" stroke="#FF69B4" stroke-width="1.6" marker-end="url(#a3)"/>
  </g>

  <!-- ============ step 11 ============ -->
  <g>
    <text x="60" y="662" font-size="11" font-weight="700" fill="#22C55E">11</text>
    <text x="76" y="662" font-size="11.5" fill="#5B6B85">SFTP 取回产物 + sha256；指标入表；通知人验收</text>
    <path d="M600,672 L970,672" stroke="#22C55E" stroke-width="1.6" marker-end="url(#a4)"/>
  </g>

  <!-- footer -->
  <text x="40" y="696" font-size="10.5" fill="#8A94A6">全过程无人值守；人只在收到通知、或主动打开该终端时出现</text>
</svg>
